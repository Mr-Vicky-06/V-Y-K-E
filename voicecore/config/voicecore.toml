# VoiceCore configuration (P0). Thresholds are HYPOTHESES - calibrate in M4 (docs/06).
[audio]
hotkey = "ctrl+alt+space"   # push-to-talk; the listener must react to this combo only
max_seconds = 30
min_press_seconds = 0.3     # ignore accidental taps shorter than this threshold
device = ""                 # device name substring or index; empty string picks primary hardware mic

[asr]
language = "en"             # Whistle: en, de, fr, es, it, nl, pl (no Tamil)
keywords = ["notepad", "calculator"]  # names/jargon to bias toward

[policy]
act_threshold = 0.80
confirm_threshold = 0.50
confirm_timeout_s = 10

[search]
roots = []                  # absolute folders search_files may read, e.g. ["D:\\Documents"]
max_results = 10

[debug]
save_audio = false
log_jsonl = true
