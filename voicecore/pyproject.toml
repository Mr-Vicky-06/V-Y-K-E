[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecore"
version = "0.1.0"
description = "Offline voice layer for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cactus-needle[mic]",
    "pynput",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

